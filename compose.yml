services:

  bot:

    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: moderation_bot

    restart: unless-stopped

    environment:
      - BOT_TOKEN

    volumes:
      - bot_data:/app/database
      
    logging:
      driver: "json-file"

      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data: